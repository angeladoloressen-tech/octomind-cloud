name: Deploy Octomind Cloud Brain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials available."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Zero-cost mode: Cloudflare deploy skipped because credentials are not configured."
          fi

      - name: Setup Node
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
